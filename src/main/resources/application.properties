# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mps?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.wmsiescore.model

# Spring Boot 2.7+ Swagger Compatibility Fix
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Swagger Configuration
springfox.documentation.swagger-ui.enabled=true
springfox.documentation.enabled=true