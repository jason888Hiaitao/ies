# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mps?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Migration Database Configuration
migration.source.url=jdbc:mysql://localhost:3306/mps?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
migration.source.username=admin
migration.source.password=123456
migration.target.url=jdbc:mysql://localhost:3306/train?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
migration.target.username=admin
migration.target.password=123456

# Migration Configuration
migration.batch-size=1000
migration.enable-resume=true
migration.enable-validation=true
migration.validation-sample-ratio=0.1
migration.progress-path=/tmp/migration/progress
migration.report-path=/tmp/migration/report

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.wmsiescore.model

# Spring Boot 2.7+ Swagger Compatibility Fix
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# AOP Log Aspect Configuration
log.aspect.enabled=true
log.aspect.log-request-args=true
log.aspect.log-response-result=true
log.aspect.log-execution-time=true
log.aspect.max-arg-length=200
log.aspect.max-result-length=1000
log.aspect.log-exception-stack-trace=true
log.aspect.log-request-id=true